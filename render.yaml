# Render blueprint for the mobile app's API (https://render.com → New → Blueprint → pick this repo).
services:
  - type: web
    name: payments-consultant-api
    runtime: python
    plan: starter            # always on; the free plan sleeps and takes ~1 min to wake, too slow in a shop
    region: singapore        # closest Render region to Australia
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ANTHROPIC_API_KEY
        sync: false          # paste the key in Render's dashboard when asked - never commit it
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false          # optional: only for keys not scoped to a workspace
      - key: APP_ACCESS_KEY
        generateValue: true  # Render makes a random value; give the same value to the app build
      - key: READS_PER_HOUR
        value: "30"
